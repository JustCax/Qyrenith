name: Qyrenith Release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "VERSION.txt"
      - "PUBLIC_FILES.txt"
      - "MANIFEST.in"
      - "scripts/release.py"
      - "tests/test_release_contents.py"
      - "tests/test_version_consistency.py"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published GitHub release tag to publish to PyPI"
        required: true
        type: string
        default: "v1.1.0"

permissions:
  contents: read

concurrency:
  group: qyrenith-release-${{ github.event.release.tag_name || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  workflow-syntax:
    name: Validate release workflow syntax
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Confirm GitHub accepted the workflow definition
        run: echo "GitHub Actions accepted the release workflow definition."

  build:
    name: Build and verify release distributions
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the pull request or published release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release identity and main-branch ancestry
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project_version = metadata["project"]["version"]
          release_version = Path("VERSION.txt").read_text(encoding="utf-8").strip()
          expected_tag = "v" + project_version

          if release_version != project_version:
              raise SystemExit(
                  f"VERSION.txt ({release_version}) does not match pyproject.toml ({project_version})"
              )
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(
                  f"Release tag {os.environ['RELEASE_TAG']} does not match expected {expected_tag}"
              )
          PY
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install packaging and test tools
        run: python -m pip install --upgrade build twine setuptools

      - name: Run the full Qyrenith self-test
        run: python qyrenith.py self-test

      - name: Verify release manifest and version consistency
        run: python -m unittest tests.test_release_contents tests.test_version_consistency -v


      - name: Build Python distributions and deterministic release archives
        shell: bash
        run: |
          BUNDLE="$RUNNER_TEMP/qyrenith-release"
          mkdir -p "$BUNDLE/pypi" "$BUNDLE/github"
          python -m build --sdist --wheel --outdir "$BUNDLE/pypi"
          python scripts/release.py "$BUNDLE/github"
          python -m twine check "$BUNDLE"/pypi/*

      - name: Install and smoke-test the built wheel
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          WHEEL="$(find "$RUNNER_TEMP/qyrenith-release/pypi" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          python -m pip install --no-deps --target "$RUNNER_TEMP/qyrenith-install" "$WHEEL"
          if [[ "$EVENT_NAME" == "release" ]]; then
            EXPECTED_VERSION="${RELEASE_TAG#v}"
          else
            EXPECTED_VERSION="$(tr -d '\r\n' < VERSION.txt)"
          fi
          EXPECTED_VERSION="$EXPECTED_VERSION" PYTHONPATH="$RUNNER_TEMP/qyrenith-install" python - <<'PY'
          import os
          import qyrenith
          import qyrenith_engine.analysis
          import qyrenith_engine.boundary
          import qyrenith_engine.execution

          if qyrenith.VERSION != os.environ["EXPECTED_VERSION"]:
              raise SystemExit(f"Unexpected installed version: {qyrenith.VERSION}")
          PY

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v7
        with:
          name: qyrenith-release-${{ github.event.release.tag_name || inputs.release_tag || github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/qyrenith-release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Python distributions to PyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qyrenith/
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download verified Python distributions
        uses: actions/download-artifact@v8
        with:
          name: qyrenith-release-${{ github.event.release.tag_name || inputs.release_tag }}
          path: release-bundle

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-bundle/pypi/

  attach-github-assets:
    name: Attach deterministic archives to the GitHub Release
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified release archives
        uses: actions/download-artifact@v8
        with:
          name: qyrenith-release-${{ github.event.release.tag_name || inputs.release_tag }}
          path: release-bundle

      - name: Attach ZIP, TAR, and SHA-256 files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release-bundle/github/* --clobber
