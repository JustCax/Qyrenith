name: Qyrenith CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Syntax check
        run: python -m py_compile qyrenith.py workers/example-worker.py
      - name: Full self-test
        run: python qyrenith.py self-test
      - name: External worker protocol
        shell: bash
        run: |
          printf '%s\n' '{"operation":"discover"}' | python workers/example-worker.py
          printf '%s\n' '{"operation":"result"}' | python workers/example-worker.py
      - name: Public audit
        run: python qyrenith.py public-audit
      - name: Documentation links
        run: python scripts/check-doc-links.py
      - name: JSON schemas
        run: python scripts/check-schemas.py
      - name: Package hygiene
        shell: bash
        run: |
          # Artifacts generated by the earlier steps (pyc files, caches) are
          # expected in the work tree; what must never be tracked is junk:
          # bytecode, temp files, and state/backup directories.
          ! git ls-files | grep -qE '(^|/)(__pycache__|\.qyrenith|\.backups)/|\.(pyc|tmp)$'
      - name: Release package and checksum
        shell: bash
        run: |
          VERSION="$(cat VERSION.txt)"
          DIST="$RUNNER_TEMP/qyrenith-dist"
          bash scripts/release.sh "$DIST"
          unzip -t "$DIST/qyrenith-$VERSION.zip"
          tar -tzf "$DIST/qyrenith-$VERSION.tar.gz" >/dev/null
          # The checksum file references the archive by name, so verify it
          # from the directory that holds both.
          ( cd "$DIST" && sha256sum -c "qyrenith-$VERSION.zip.sha256" )
          ( cd "$DIST" && sha256sum -c "qyrenith-$VERSION.tar.gz.sha256" )
          # Must be empty (no forbidden entries).
          ! unzip -l "$DIST/qyrenith-$VERSION.zip" | grep -E '(^|/)(\.qyrenith|\.backups|__pycache__|.*\.pyc|.*\.tmp|target|node_modules|Cargo\.lock|\.gradle|build|runs)(/|$)'
          ! tar -tzf "$DIST/qyrenith-$VERSION.tar.gz" | grep -E '(^|/)(\.qyrenith|\.backups|__pycache__|.*\.pyc|.*\.tmp|target|node_modules|Cargo\.lock|\.gradle|build|runs)(/|$)'

  example-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Build public NeoForge example
        working-directory: examples/example-neoforge-mod
        run: ./gradlew build
