name: Qyrenith CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: qyrenith-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Syntax check
        run: python -m py_compile qyrenith.py workers/example-worker.py
      - name: Full self-test
        run: python qyrenith.py self-test
      - name: External worker protocol
        shell: bash
        run: |
          printf '%s\n' '{"operation":"discover"}' | python workers/example-worker.py
          printf '%s\n' '{"operation":"result"}' | python workers/example-worker.py
      - name: Public audit
        run: python qyrenith.py public-audit
      - name: Documentation links
        run: python scripts/check-doc-links.py
      - name: JSON schemas
        run: python scripts/check-schemas.py
      - name: Package hygiene
        shell: bash
        run: |
          # Artifacts generated by the earlier steps (pyc files, caches) are
          # expected in the work tree; what must never be tracked is junk:
          # bytecode, temp files, and state/backup directories.
          ! git ls-files | grep -qE '(^|/)(__pycache__|\.qyrenith|\.backups)/|\.(pyc|tmp)$'
      - name: Release manifest contents
        run: python -m unittest tests.test_release_contents -v
      - name: Release package and checksum
        shell: bash
        run: |
          VERSION="$(cat VERSION.txt)"
          DIST="$RUNNER_TEMP/qyrenith-dist"
          bash scripts/release.sh "$DIST"
          unzip -t "$DIST/qyrenith-$VERSION.zip"
          tar -tzf "$DIST/qyrenith-$VERSION.tar.gz" >/dev/null
          # The checksum file references the archive by name, so verify it
          # from the directory that holds both.
          ( cd "$DIST" && sha256sum -c "qyrenith-$VERSION.zip.sha256" )
          ( cd "$DIST" && sha256sum -c "qyrenith-$VERSION.tar.gz.sha256" )
          # Must be empty (no forbidden entries).
          ! unzip -l "$DIST/qyrenith-$VERSION.zip" | grep -E '(^|/)(\.qyrenith|\.backups|__pycache__|.*\.pyc|.*\.tmp|target|node_modules|Cargo\.lock|\.gradle|build|runs)(/|$)'
          ! tar -tzf "$DIST/qyrenith-$VERSION.tar.gz" | grep -E '(^|/)(\.qyrenith|\.backups|__pycache__|.*\.pyc|.*\.tmp|target|node_modules|Cargo\.lock|\.gradle|build|runs)(/|$)'

  example-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Build public NeoForge example
        working-directory: examples/example-neoforge-mod
        run: ./gradlew build

  engineering-engine-matrix:
    name: Engineering engine / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile engineering engine
        run: python -m py_compile qyrenith_engine/__init__.py qyrenith_engine/analysis.py qyrenith_engine/boundary.py qyrenith_engine/execution.py qyrenith_engine/trust_store.py qyrenith_engine/migration/__init__.py qyrenith_engine/migration/assurance.py qyrenith_engine/migration/authorization.py qyrenith_engine/migration/model.py qyrenith_engine/migration/knowledge.py qyrenith_engine/migration/planner.py qyrenith_engine/migration/snapshot.py qyrenith_engine/migration/workspace.py qyrenith_engine/migration/worker.py qyrenith_engine/migration/preparation.py
      - name: Engineering engine tests
        run: python -m unittest tests.test_trust_store tests.test_engine_110 tests.test_engine_cli_110 tests.test_migration_core_120 tests.test_migration_snapshot_120 tests.test_migration_workspace_120 tests.test_migration_assurance_120 tests.test_migration_authorization_120 tests.test_migration_worker_120 tests.test_migration_preparation_120 tests.test_migration_benchmarks_120 -v
