[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qyrenith"
version = "1.0.0"
description = "Verification, safety, and orchestration control plane for Non-AI and AI-assisted software development."
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
qyrenith = "qyrenith:main"

[tool.setuptools]
py-modules = ["qyrenith"]
