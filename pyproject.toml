[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qyrenith"
version = "1.0.0"
description = "Verification, safety, and orchestration control plane for Non-AI and AI-assisted software development."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "JustCax" }]
keywords = [
    "verification",
    "orchestration",
    "ai-agents",
    "minecraft",
    "neoforge",
    "mcp",
    "cli",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/JustCax/Qyrenith"
Repository = "https://github.com/JustCax/Qyrenith"
Issues = "https://github.com/JustCax/Qyrenith/issues"
Changelog = "https://github.com/JustCax/Qyrenith/releases"
Documentation = "https://github.com/JustCax/Qyrenith#readme"

[project.scripts]
qyrenith = "qyrenith:main"

[tool.setuptools]
py-modules = ["qyrenith"]
license-files = ["LICENSE"]
